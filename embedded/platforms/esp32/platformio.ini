; PlatformIO Configuration for Atomic-1Bit ESP32 Demo
;
; Build: pio run
; Upload: pio run --target upload
; Upload SPIFFS data: pio run --target uploadfs
; Monitor: pio device monitor

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Enable PSRAM (required for model embeddings)
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -O2

; Partition scheme with large SPIFFS for model storage
; The pocket model at ~0.5MB (packed) fits in a 1MB SPIFFS partition
board_build.partitions = huge_app.csv

; Upload speed
upload_speed = 921600
