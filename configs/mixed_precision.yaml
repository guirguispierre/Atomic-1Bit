model:
  name: "atomic-12.5M-mixed"
  dim: 320
  depth: 8
  heads: 5
  context_length: 256
  vocab_size: 4096

quantization:
  weight_bits: 1.58
  activation_bits: 8
  per_layer_config:
    - layer: 0
      weight_bits: 4  # higher precision for first layer
    - layer: 7
      weight_bits: 4  # higher precision for output head

training:
  batch_size: 32
  grad_accum_steps: 8
  learning_rate: 3.0e-4
  warmup_steps: 1000
  max_steps: 20000
  weight_decay: 0.1
  clip_grad: 1.0
  dataset: "alpaca-cleaned"
