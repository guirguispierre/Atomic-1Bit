model:
  name: "atomic-stories-base"
  dim: 256
  depth: 6
  heads: 4
  context_length: 128
  # guirguispierre 2026-08-10 - train.py remaps gpt-2 ids into this many slots
  # by frequency; TinyStories has ~12k distinct tokens and the top 4096 cover
  # 98.8% of occurrences, so 50257 left three quarters of the rows untrained
  vocab_size: 4096

quantization:
  weight_bits: 1.58
  activation_bits: 8

training:
  batch_size: 32
  grad_accum_steps: 4
  learning_rate: 6.0e-4
  warmup_steps: 500
  max_steps: 15000
  weight_decay: 0.1
  clip_grad: 1.0
  dataset: "tinystories"
